<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S.P.A.R.K. | ASL for Kids</title>

    <!-- Link to external CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>S.P.A.R.K.</h1>
        <p class="tagline">
            Sign and Play: ASL retention for Kids
            <span class="sub-text">Learning hand signs through interactive play.</span>
        </p>

        <div class="button-group">
            <button class="button button-primary">Sign In</button>
            <button class="button">Sign Up</button>
            <button class="button">About Us</button>
            <button class="button settings-btn">Settings</button>
        </div>
    </div>

    <button class="ai-toggle-btn" onclick="toggleAI()">✨ Ask Sparky</button>

    <div class="ai-sidebar" id="ai-sidebar">
        <div class="ai-header">
            <span>S.P.A.R.K. Assistant</span>
            <button class="close-ai" onclick="toggleAI()">✕</button>
        </div>
       
        <div class="mascot-container">
            <div class="sparky" id="sparky-mascot">
                <div class="sparky-head">
                    <div class="sparky-eye left"></div>
                    <div class="sparky-eye right"></div>
                    <div class="sparky-mouth"></div>
                </div>
            </div>
        </div>

        <div class="chat-window" id="chat-window">
            <div class="bubble ai-bubble">
                Hi! I'm Sparky! I can show you how to sign words like 
                <b>Hello, Thank you, Please,</b> or <b>Help</b>. Just type a word below!
            </div>
        </div>

        <div class="chat-input-area">
            <input type="text" id="user-input" placeholder="Ask Sparky...">
            <button id="send-btn">Send</button>
        </div>
    </div>

    <script>
        const sidebar = document.getElementById('ai-sidebar');
        const mascot = document.getElementById('sparky-mascot');
        const chatWindow = document.getElementById('chat-window');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');

        const signs = {
            "hello": { v: "👋", d: "Move your hand from your forehead outward like a salute." },
            "thank you": { v: "🙏", d: "Touch your chin and move your hand forward toward the person." },
            "please": { v: "🔄", d: "Rub your flat hand in a circle over your chest." },
            "mother": { v: "👩", d: "Tap your thumb on your chin with an open hand." },
            "father": { v: "👨", d: "Tap your thumb on your forehead with an open hand." },
            "help": { v: "🙋", d: "Place a 'thumbs up' hand on your flat palm and lift together." },
            "sorry": { v: "✊", d: "Rub a fist in a circle over your chest." },
            "yes": { v: "✊", d: "Nod your fist up and down like a head." },
            "no": { v: "🤌", d: "Snap index and middle finger down to your thumb." }
        };

        function toggleAI() {
            sidebar.classList.toggle('active');
        }

        function sparkyTalk(duration) {
            mascot.classList.add('talking');
            setTimeout(() => {
                mascot.classList.remove('talking');
            }, duration);
        }

        function addMsg(html, type) {
            const b = document.createElement('div');
            b.className = `bubble ${type}-bubble`;
            b.innerHTML = html;
            chatWindow.appendChild(b);
            chatWindow.scrollTop = chatWindow.scrollHeight;

            if (type === 'ai') {
                sparkyTalk(1500);
            }
        }

        function handle() {
            const val = userInput.value.trim().toLowerCase();
            if (!val) return;

            addMsg(userInput.value, 'user');
            userInput.value = "";

            setTimeout(() => {
                let found = false;
                for (let key in signs) {
                    if (val.includes(key)) {
                        addMsg(`
                            <div class="sign-card">
                                <b class="sign-title">${key} ${signs[key].v}</b>
                                <p class="sign-desc">${signs[key].d}</p>
                            </div>
                        `, 'ai');
                        found = true;
                        break;
                    }
                }
                if (!found) {
                    addMsg("I'm still learning that one! Try 'Hello' or 'Please'.", "ai");
                }
            }, 600);
        }

        sendBtn.addEventListener('click', handle);
        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handle();
        });
    </script>
</body>
</html>
