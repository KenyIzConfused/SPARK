<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S.P.A.R.K. | ASL for Kids</title>
    <link rel="stylesheet" href="style.css">
    <!-- Materialize CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">
</head>
<body>

    <div class="container">
        <h1>S.P.A.R.K.</h1>
        <p class="tagline">
            Sign and Play: ASL retention for Kids
            <span class="sub-text">Learning hand signs through interactive play.</span>
        </p>

        <div class="button-group">
            <button class="button button-primary">Sign In</button>
            <button class="button about-btn">About Us</button>
            <button class="button settings-btn">Settings</button>
        </div>
    </div>

    <button class="ai-toggle-btn" onclick="toggleAI()">✨ Ask Sparky</button>

    <div class="ai-sidebar" id="ai-sidebar">
        <div class="ai-header">
            <span>Sparky Assistant</span>
            <button style="background:none; border:none; color:white; font-size:22px; cursor:pointer;" onclick="toggleAI()">✕</button>
        </div>
        <div class="mascot-container">
            <div class="sparky-head">
                <div class="eye-row">
                    <div id="l" class="eye-wrap"><div class="pupil"></div></div>
                    <div id="m" class="eye-wrap"><div class="pupil"></div></div>
                </div>
                <div class="sparky-mouth-ai"></div>
            </div>
        </div>
        <div class="chat-window" id="chat-window">
            <div class="bubble ai-bubble">Hi friend! Type a word and I'll help you sign it!</div>
        </div>
        <div class="chat-input-area">
            <input type="text" id="user-input" placeholder="Type a word...">
            <button id="send-btn">Send</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
</html>
