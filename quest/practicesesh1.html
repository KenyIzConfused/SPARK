<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practice Session 1 | S.P.A.R.K.</title>
    <link rel="stylesheet" href="quest.css">
</head>
<body>
    <button class="settings-corner-btn" onclick="toggleSettings()">⚙️</button>

    <!-- Mascot in the middle (behind content) -->
    <div class="main-mascot-wrapper">
        <div class="mascot-head-circle">
            <div class="mascot-face">
                <div class="blush blush-l"></div>
                <div class="blush blush-r"></div>
                <div class="sketch-eye eye-l"><div class="eye-shine"></div></div>
                <div class="sketch-eye eye-r"><div class="eye-shine"></div></div>
                <div class="sketch-mouth"></div>
            </div>
        </div>
    </div>

    <div class="main-content">
        <div class="logo-label">LOGO</div>
        <h1>ASL PRACTICE SESSION</h1>
        <div class="tagline" id="user-tagline">SESSION 1</div>

        <div class="instruction-card">
            <h2>Perform "Hello!" in ASL</h2>
            <p class="sign-description">Move your hand from your forehead outward like a salute.</p>
            <div class="sign-emoji">👋</div>
        </div>

        <div class="camera-container">
            <video id="videoElement" autoplay playsinline></video>
            <canvas id="canvasElement"></canvas>
            <div class="camera-controls">
                <button class="button" id="startCameraBtn">START</button>
                <button class="button" id="captureBtn" style="display: none;">Capture Sign</button>
                <button class="button" id="retakeBtn" style="display: none;">Retake</button>
                <button class="button" id="nextBtn" style="display: none;">Next Sign</button>
            </div>
        </div>

        <div class="feedback-section" id="feedback-section" style="display: none;">
            <h3>Feedback:</h3>
            <p id="feedback-text"></p>
            <div class="result-emoji" id="result-emoji"></div>
        </div>
    </div>

    <button class="ai-toggle-btn" onclick="toggleAI()">✨ Ask Sparky</button>

    <div class="ai-sidebar" id="ai-sidebar">
        <div class="ai-header">
            <span>Sparky Assistant</span>
            <button style="background:none; border:none; color:white; font-size:22px; cursor:pointer;" onclick="toggleAI()">✕</button>
        </div>
        <div class="mascot-container">
            <div class="sparky-head">
                <div class="eye-row">
                    <div id="l" class="eye-wrap"><div class="pupil"></div></div>
                    <div id="m" class="eye-wrap"><div class="pupil"></div></div>
                </div>
                <div class="sparky-mouth-ai"></div>
            </div>
        </div>
        <div class="chat-window" id="chat-window">
            <div class="bubble ai-bubble">Hi friend! Type a word and I'll help you sign it!</div>
        </div>
        <div class="chat-input-area">
            <input type="text" id="user-input" placeholder="Type a word...">
            <button id="send-btn">Send</button>
        </div>
    </div>

    <div class="settings-popup-overlay" id="settings-popup-overlay">
        <div class="settings-popup">
            <button class="close-btn" id="settings-close-btn">✕</button>
            <h2>Settings</h2>
            <div class="settings-section">
                <label for="user-name">Your Name</label>
                <input type="text" id="user-name" placeholder="Enter your name">
            </div>
            <div class="settings-section">
                <label for="theme-select">Theme</label>
                <select id="theme-select">
                    <option value="default">Default</option>
                    <option value="dark">Dark Mode</option>
                    <option value="pastel">Pastel</option>
                </select>
            </div>
            <div class="settings-section">
                <label>
                    <input type="checkbox" id="notifications-toggle" checked>
                    Enable Notifications
                </label>
            </div>
            <button class="settings-save-btn" id="settings-save-btn">Save Settings</button>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js"></script>
    
    <!-- Main Logic -->
    <script src="practicesesh1.js"></script>
</body>
</html>
