<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | S.P.A.R.K.</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="register.css">
</head>
<body>
    <button class="settings-corner-btn" onclick="handleNav('Settings')">⚙️</button>

    <div class="register-container">
        <div class="register-card">
            <h1>CREATE ACCOUNT</h1>
            
            <div class="form-group">
                <label for="firstName">First Name:</label>
                <input type="text" id="firstName" placeholder="Enter your first name">
            </div>
            
            <div class="form-group">
                <label for="surName">Surname:</label>
                <input type="text" id="surName" placeholder="Enter your surname">
            </div>
            
            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" placeholder="Enter your email">
            </div>
            
            <div class="form-group">
                <label for="password">Password:</label>
                <input type="password" id="password" placeholder="Enter password (min 6 chars)">
            </div>

            <button class="register-button" onclick="registerWithEmailForm()">REGISTER ACCOUNT</button>

            <div class="register-link" onclick="window.location.href='../index.html'">
                ALREADY HAVE AN ACCOUNT? <span>SIGN IN HERE</span>
            </div>
        </div>
    </div>

    <script src="../script.js"></script>
    <script src="register.js"></script>
    <script src="../auth/auth.js"></script>
</body>
</html>
